name: Release Build and Upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the project (Release)
        run: cargo build --release

      - name: Strip symbols (Linux/macOS)
        if: runner.os != 'Windows'
        run: strip target/release/LeedsUniCheckIn

      - name: Strip symbols (Windows)
        if: runner.os == 'Windows'
        run: strip target\\release\\LeedsUniCheckIn.exe

      - name: Prepare release folder
        run: |
          mkdir -p release
          cp src/rooms.txt release/ || echo "rooms.txt copy skipped"

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          zip -j LeedsUniCheckIn-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.zip \
            target/release/LeedsUniCheckIn release/rooms.txt

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\LeedsUniCheckIn.exe","src\rooms.txt" -DestinationPath "LeedsUniCheckIn-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeedsUniCheckIn-${{ runner.os }}
          path: LeedsUniCheckIn-*.zip
